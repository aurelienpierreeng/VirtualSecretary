name: Deploy MkDocs

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r recipe/requirements.txt
          pip install -r recipe/requirements-dev.txt
          pip install -r recipe/requirements-email.txt
          python download.py

      - name: Build documentation
        run: mkdocs build --strict

      - name: Publish the funding provenance file
        run: |
          # MkDocs skips dot-directories under docs/, so copy it into site/ by hand.
          # The root copy is a fallback: if the upload action is ever bumped back to
          # v4 (which strips dot-directories), /.well-known/ silently disappears and
          # this one keeps the provenance reachable.
          mkdir -p site/.well-known
          cp -r docs/.well-known/. site/.well-known/
          cp docs/.well-known/funding-manifest-urls site/funding-manifest-urls
          ls -la site/.well-known/ site/funding-manifest-urls

      - name: Inspect sitemap
        run: |
          ls -lah site/
          echo "===================="
          cat site/sitemap.xml

      - name: Upload Pages artifact
        # Pinned to v3 deliberately: v4 adds --exclude=".[^/]*" to its tar, which
        # strips every dot-directory from the artifact — including .well-known,
        # which then 404s on the published site. ansel.photos serves its
        # .well-known fine precisely because it is still on v3.
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4