name: Deploy MkDocs

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r recipe/requirements.txt
          pip install -r recipe/requirements-dev.txt
          pip install -r recipe/requirements-email.txt
          python download.py

      - name: Build documentation
        run: mkdocs build --strict

      - name: Publish the funding provenance file
        run: |
          # MkDocs skips dot-directories under docs/, AND GitHub Pages refuses to
          # serve them even when they reach the artifact (verified: both the custom
          # domain and *.github.io return 404 for /.well-known/...). So publish the
          # file at the site root, which Pages does serve, and keep the .well-known
          # copy for any host that would serve it.
          mkdir -p site/.well-known
          cp -r docs/.well-known/. site/.well-known/
          cp docs/.well-known/funding-manifest-urls site/funding-manifest-urls
          ls -la site/.well-known/ site/funding-manifest-urls

      - name: Inspect sitemap
        run: |
          ls -lah site/
          echo "===================="
          cat site/sitemap.xml

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4